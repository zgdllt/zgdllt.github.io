projects:
- name: Humanoid Soccer Navigation and Obstacle Perception
  affiliation: Tsinghua Hephaestus
  date: 2025 - Present
  bullets:
  - Developed an A* path planner and trained a reinforcement-learning navigation policy for humanoid soccer.
  - Used forward kinematics to project the robot's own joints into the camera image and filter self-occlusions from obstacle observations.
- name: Humanoid Roller-Skating Control and PhysX Wheel Modeling
  affiliation: Research project
  date: 2025 - Present
  bullets:
  - Replaced mesh-based wheel collisions with thin cylindrical slices to avoid abnormally high slip ratios in PhysX.
  - Identified the simulation cost introduced by many radius-specific collision bodies and am investigating performance-oriented optimization methods.
  - Participated in reinforcement-learning training and co-authored the accepted CLAWAR 2026 paper.

