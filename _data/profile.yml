short_bio: >-
  <p>
    I am interested in embodied intelligence, physics-based animation, differentiable physics,
    and efficient robot simulation. I work with MuJoCo, Isaac Lab, and PyTorch on humanoid
    navigation, locomotion, and learning-based control.
  </p>
  <p>
    At Tsinghua Hephaestus, I contribute to the long-term engineering of humanoid robot soccer,
    including navigation, obstacle perception, simulation, and competition-oriented development.
  </p>

